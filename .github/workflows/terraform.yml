name: terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply after plan (requires environment approval)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # AWS OIDC

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform

  plan-apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production # configure required reviewers on this environment
    env:
      OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write tfvars and Google key
        working-directory: terraform
        run: |
          umask 077
          printf '%s' "$TFVARS" > terraform.auto.tfvars
          printf '%s' "$GWS_SA_KEY" > sa-key.json
        env:
          TFVARS: ${{ secrets.TFVARS }}
          GWS_SA_KEY: ${{ secrets.GWS_SA_KEY }}
      - run: terraform init
        working-directory: terraform
      - run: terraform plan -out=tfplan
        working-directory: terraform
      - if: inputs.apply
        run: terraform apply tfplan
        working-directory: terraform
